name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stdlib only — nothing to install. The Mac end-to-end test (say + Apple ASR) skips itself here.
      - run: python -m unittest discover -s tests -t . -v
